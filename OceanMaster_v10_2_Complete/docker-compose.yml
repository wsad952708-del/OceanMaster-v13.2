services:
  oceanmaster:
    build: .
    image: oceanmaster:10.4
    container_name: oceanmaster-captain
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Taipei
      - LOG_LEVEL=INFO
    volumes:
      - ./output:/app/output
      - ./data/cache:/app/data/cache
      - ./ml_system/models:/app/ml_system/models
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "--max-time", "5", "http://localhost:8000/health" ]
      interval: 120s
      timeout: 30s
      retries: 5
      start_period: 300s
